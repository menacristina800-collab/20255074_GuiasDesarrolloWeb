<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo Web - Portafolio de Guías</title>
    <style>
        body{
            background-color: #eef2f5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }
        h1{
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: 0 auto 30px auto;
        }
        .guias-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .guia-card{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .guia-card h2{
            color: #1a1a1a;
        }
        .guia-card a{
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1a1a1a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .guia-card a:hover{
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>Desarrollo Web - Portafolio de Guías</h1>
    <div class="guias-container">
        <div class="guia-card">
            <a href="Guia1/index_guia1.html">Ver Guía 1</a>
        </div>
        <div class="guia-card">
            <a href="Guia2/index_guia2.html">Ver Guía 2</a>
        </div>
    </div>
</body>
</html>
