<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos de la cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="./pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <!-- Formulario -->
      <form id="formPedido" class="card card-body mb-3" novalidate>
        <div class="row g-3">
          <div class="col-md-5">
            <label for="idProducto" class="form-label">Producto</label>
            <input type="text" id="idProducto" class="form-control" placeholder="Café americano" />
          </div>
          <div class="col-md-3">
            <label for="idPrecio" class="form-label">Precio unitario</label>
            <input type="number" id="idPrecio" class="form-control" step="0.01" placeholder="2.50" />
          </div>
          <div class="col-md-2">
            <label for="idCantidad" class="form-label">Cantidad</label>
            <input type="number" id="idCantidad" class="form-control" placeholder="3" />
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" id="idBtnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
          </div>
        </div>
        <div id="idMensaje" class="mt-3"></div>
      </form>

      <!-- Filtro -->
      <div class="card card-body mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="idPrecioMaximo" class="form-label">Precio máximo</label>
            <input type="number" id="idPrecioMaximo" class="form-control" step="0.01" />
          </div>
          <div class="col-md-8 d-flex gap-2 flex-wrap">
            <button type="button" id="idBtnFiltrar" class="btn btn-success">Filtrar productos</button>
            <button type="button" id="idBtnMostrarTodos" class="btn btn-secondary">Mostrar todos</button>
            <button type="button" id="idBtnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Precio unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="idCuerpoTabla"></tbody>
      </table>

      <!-- Totales -->
      <div class="row text-center">
        <div class="col-md-6">
          <div class="alert alert-info">
            Total de unidades: <strong id="idTotalUnidades">0</strong>
          </div>
        </div>
        <div class="col-md-6">
          <div class="alert alert-success">
            Monto total: <strong id="idMontoTotal">$0.00</strong>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
